[project]
name = "mail-verification"
version = "0.1.0"
description = "Gestor y notificador de correos de Gmail en terminal"
readme = "README.md"
authors = [
    { name = "NicoBaires", email = "nicolamattina80@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
]

[project.scripts]
mail-verification = "mail_verification:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
